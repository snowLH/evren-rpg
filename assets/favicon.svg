<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a2a4a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#03070d" stop-opacity="1"/>
    </radialGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="64" fill="url(#bgGlow)"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="#00e5ff" stroke-width="6" stroke-dasharray="14 10" filter="url(#glowCyan)"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#d4af37" stroke-width="5" opacity="0.85"/>
  <circle cx="256" cy="256" r="100" fill="none" stroke="#ff2a4b" stroke-width="4" stroke-dasharray="8 6"/>
  <!-- Linhas Táticas / Retículo -->
  <line x1="256" y1="40" x2="256" y2="472" stroke="#00e5ff" stroke-width="2" opacity="0.6"/>
  <line x1="40" y1="256" x2="472" y2="256" stroke="#00e5ff" stroke-width="2" opacity="0.6"/>
  <!-- Pontas da Rosa dos Ventos -->
  <polygon points="256,76 270,230 256,210 242,230" fill="#00e5ff"/>
  <polygon points="256,436 270,282 256,302 242,282" fill="#00e5ff"/>
  <polygon points="76,256 230,242 210,256 230,270" fill="#00e5ff"/>
  <polygon points="436,256 282,242 302,256 282,270" fill="#00e5ff"/>
  <!-- Singularity Core -->
  <circle cx="256" cy="256" r="32" fill="#00e5ff" filter="url(#glowCyan)"/>
  <circle cx="256" cy="256" r="16" fill="#ffffff"/>
</svg>